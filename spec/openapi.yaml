  # ====================
  # INTERNAL AGENT API
  # ====================
  /internal/agents/{agent_id}/invoke:
    post:
      summary: Invoke an agent (worker API)
      operationId: invokeAgent
      security: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, context]
              properties:
                tenant_id:
                  type: string
                  format: uuid
                context:
                  type: object
                  additionalProperties: true
                prompt:
                  type: string
      responses:
        "200":
          description: Agent result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # ====================
