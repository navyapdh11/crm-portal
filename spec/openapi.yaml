                $ref: "#/components/schemas/Comment"

  # ====================
  # AUTOMATIONS
  # ====================
  /tenants/{tenant_id}/automations:
    get:
      summary: List automations for tenant
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        "200":
          description: List of automations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Automation"

    post:
      summary: Create an automation
      parameters:
        - $ref: "#/components/parameters/tenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, trigger, action]
              properties:
                name:
                  type: string
                trigger:
                  type: string
                action:
                  type: object
                enabled:
                  type: boolean
                  default: true
                metadata:
                  type: object
      responses:
        "201":
          description: Automation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"

  /tenants/{tenant_id}/automations/{automation_id}:
    get:
      summary: Get automation by ID
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - name: automation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"

    patch:
      summary: Update automation
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - name: automation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                enabled:
                  type: boolean
                action:
                  type: object
                metadata:
                  type: object
      responses:
        "200":
          description: Automation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"

    delete:
      summary: Delete automation
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - name: automation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Automation deleted

  /tenants/{tenant_id}/trigger:
    post:
      summary: Trigger automation by key
      parameters:
        - $ref: "#/components/parameters/tenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, context]
              properties:
                key:
                  type: string
                  example: "new_lead_followup"
                context:
                  type: object
                  additionalProperties: true
      responses:
        "202":
          description: Async run accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  automation_run_id:
                    type: string
                    format: uuid
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenant_id}/automation_runs:
    get:
      summary: List automation runs
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of automation runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomationRun"

