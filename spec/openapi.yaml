        - $ref: "#/components/parameters/projectIdPath"
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, url]
              properties:
                filename:
                  type: string
                url:
                  type: string
                  format: uri
                mime_type:
                  type: string
                size_bytes:
                  type: integer
                metadata:
                  type: object
      responses:
        "201":
          description: File created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"

  # ====================
  # PROJECT COMMENTS
  # ====================
  /tenants/{tenant_id}/projects/{project_id}/comments:
    get:
      summary: List project comments
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/projectIdPath"
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"

    post:
      summary: Create a comment
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/projectIdPath"
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
