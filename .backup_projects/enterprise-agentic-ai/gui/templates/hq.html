<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enterprise AI HQ | G4H-RMA</title>
    <style>
        :root { --surface: #050507; --signal: #00d992; --border: #1a1a1a; }
        body { background: var(--surface); color: #ccc; font-family: 'Inter', sans-serif; margin: 0; display: flex; }
        sidebar { width: 200px; border-right: 1px solid var(--border); height: 100vh; padding: 20px; }
        main { flex: 1; padding: 20px; }
        .card { border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 20px; background: #0a0a0c; }
        h1, h2 { color: var(--signal); }
        .btn { background: var(--signal); color: var(--surface); border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <sidebar>
        <h2>HQ</h2>
        <a href="#dashboard" style="color:var(--signal)">Dashboard</a><br><br>
        <a href="#flashcards">Knowledge Base</a>
    </sidebar>
    <main>
        <h1>[ COMMAND HQ : G4H-RMA ]</h1>
        <div class="card" id="dashboard">
            <h2>Status Layer</h2>
            <div id="metrics">Loading system status...</div>
<div id="chart" style="height: 300px; width: 100%;"></div>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script>
const chart = LightweightCharts.createChart(document.getElementById("chart"), { width: 600, height: 300 });
const lineSeries = chart.addAreaSeries();
// Wire to yfinance data via API in next step
</script>
        </div>
        <div class="card" id="flashcards">
            <h2>Knowledge Base</h2>
            <div id="flashcards-list"></div>
            <input id="new-fc" placeholder="Add entry...">
            <button class="btn" onclick="addCard()">SAVE</button>
        </div>
    </main>
    <script>
        async function loadMetrics() {
            const res = await fetch('/api/v1/metrics/summary');
            const data = await res.json();
            document.getElementById('metrics').innerText = 'Active Agents: ' + data.active_agents;
        }
        async function addCard() {
            const content = document.getElementById('new-fc').value;
            // Wire to RAG endpoint
            await fetch('/api/v1/rag/documents', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({doc_id: Date.now().toString(), content: content})
            });
            location.reload();
        }
        loadMetrics();
    </script>
</body>
</html>
