version: '3.8'

services:
  # Main Application
  app:
    build: .
    container_name: agentic-ai-app
    ports:
      - "8100:8100"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/agentic_ai
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - PROMETHEUS_PORT=9100
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GUI_PORT=8100
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      - redis
      - db
      - otel-collector
    networks:
      - agentic-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis/redis-stack:latest
    container_name: agentic-ai-redis
    ports:
      - "6380:6379"
      - "8101:8001"  # RedisInsight
    volumes:
      - redis-data:/data
    networks:
      - agentic-network
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: agentic-ai-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agentic_ai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agentic-network
    restart: unless-stopped

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: agentic-ai-otel
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "8888:8888"  # Prometheus metrics
      - "8889:8889"  # Prometheus exporter
    volumes:
      - ./config/otel-config.yaml:/etc/otel/config.yaml
    command: ["--config", "/etc/otel/config.yaml"]
    networks:
      - agentic-network
    restart: unless-stopped

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: agentic-ai-prometheus
    ports:
      - "9100:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - agentic-network
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: agentic-ai-grafana
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
    networks:
      - agentic-network
    restart: unless-stopped

  # Jaeger (Distributed Tracing UI)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: agentic-ai-jaeger
    ports:
      - "8103:16686"  # Jaeger UI
      - "14269:14268"  # Jaeger HTTP
    networks:
      - agentic-network
    restart: unless-stopped

  # MCP Server
  mcp-server:
    build: .
    container_name: agentic-ai-mcp
    command: ["python", "-m", "mcp_server.main"]
    ports:
      - "8102:8102"
    environment:
      - REDIS_HOST=redis
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - redis
    networks:
      - agentic-network
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  agentic-network:
    driver: bridge
