apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskacade-api
  namespace: taskacade
spec:
  replicas: 3
  selector:
    matchLabels:
      app: taskacade-api
  template:
    metadata:
      labels:
        app: taskacade-api
    spec:
      containers:
        - name: api
          image: your-registry/taskacade-api:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskacade-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis-master:6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: taskacade-secrets
                  key: jwt-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: taskacade-secrets
                  key: openai-api-key
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: taskacade-api
  namespace: taskacade
spec:
  selector:
    app: taskacade-api
  ports:
    - port: 80
      targetPort: 4000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskacade-api-hpa
  namespace: taskacade
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: taskacade-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
