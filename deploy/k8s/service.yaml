apiVersion: v1
kind: Service
metadata:
  name: crm-api
  namespace: crm-portal
spec:
  selector:
    app: crm-api
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: crm-postgres
  namespace: crm-portal
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: crm-redis
  namespace: crm-portal
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP